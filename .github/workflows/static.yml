# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs validation on all branches & PRs; Pages deployment only runs on main/master
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check Bash scripts (bash -n)
        run: |
          set -euo pipefail
          checked=0
          for f in install ubuntu hostvn update; do
            bash -n "$f"
            checked=$((checked + 1))
          done
          while IFS= read -r -d '' f; do
            first_line=$(head -n 1 "$f" 2>/dev/null || true)
            if [[ "$first_line" == "#!"*bash* ]]; then
              bash -n "$f"
              checked=$((checked + 1))
            elif [[ "$first_line" == "#!"*/sh* ]]; then
              sh -n "$f"
              checked=$((checked + 1))
            fi
          done < <(find menu -path menu/template -prune -o -type f -print0)
          echo "Syntax check OK: ${checked} shell scripts passed."

      - name: Syntax check Python scripts (py_compile)
        run: |
          set -euo pipefail
          python3 -m py_compile menu/telegram_bot/*.py
          echo "Python py_compile OK."

      - name: Sanity check version file
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ver=$(grep '^script_version=' version | cut -d'=' -f2)
          [ -n "${ver}" ] || { echo "::error::version thieu script_version"; exit 1; }
          echo "Phien ban kiem tra: script_version=${ver}"
          if [[ "${REF_NAME}" == "refs/heads/main" || "${REF_NAME}" == "refs/heads/master" || ( "${EVENT_NAME}" == "pull_request" && ( "${BASE_REF}" == "main" || "${BASE_REF}" == "master" ) ) ]]; then
            if [[ "${ver}" == *-* ]]; then
              echo "::error::Khong duoc phat hanh phien ban pre-release (${ver}) len main! Hay bo hau to -dev trong file version truoc khi merge."
              exit 1
            fi
          fi

  # Single deploy job since we're just deploying (main/master only)
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Tu dong bat GitHub Pages (build type: workflow) neu repo chua bat
          enablement: true
      # menu.tar.gz KHONG duoc commit - sinh o day tu thu muc menu/ de goi phan phoi
      # luon khop ma nguon (truoc day phai dong goi tay, quen mot lan la nguoi dung
      # bam Update se nhan ban menu cu).
      - name: Build menu.tar.gz from menu/
        run: |
          set -euo pipefail
          test -d menu || { echo "::error::khong tim thay thu muc menu/"; exit 1; }
          rm -f menu.tar.gz
          tar --format=gnu --sort=name \
              --owner=0 --group=0 --numeric-owner \
              -czf menu.tar.gz menu
          # Liet ke ra FILE roi moi kiem tra. Neu dua thang qua ong vao "grep -q"
          # thi grep thoat ngay khi thay dong dau tien, tar bi dut ong (SIGPIPE)
          # va "set -o pipefail" coi ca pipeline la that bai — buoc nay bao loi
          # "thieu file" DU rang file co that.
          tar tzf menu.tar.gz > /tmp/pkg_list.txt
          echo "So file trong goi: $(grep -vc '/$' /tmp/pkg_list.txt)"
          grep -q 'menu/hostvn' /tmp/pkg_list.txt \
            || { echo "::error::goi thieu file mong doi"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
